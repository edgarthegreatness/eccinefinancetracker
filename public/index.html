<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#161b22;--muted:#6a7482;--line:#e0e3e8;--accent:#9a6b00;--accentbg:#fff3d1;--good:#16794c;--bad:#b3261e;--input:#f7f8fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#171d25;--text:#eef1f5;--muted:#8d97a6;--line:#262e39;--accent:#f0b429;--accentbg:#2b2410;--good:#4cc38a;--bad:#ff7b72;--input:#0f141a}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#171d25;--text:#eef1f5;--muted:#8d97a6;--line:#262e39;--accent:#f0b429;--accentbg:#2b2410;--good:#4cc38a;--bad:#ff7b72;--input:#0f141a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
.num{font-variant-numeric:tabular-nums}
header{padding:18px 16px 6px;max-width:640px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
main{max-width:640px;margin:0 auto;padding:8px 16px}
.hero{background:var(--accentbg);border:1px solid var(--accent);border-radius:16px;padding:16px;margin-bottom:12px}
.hero small{color:var(--muted);display:block}
.hero b{font-size:30px;letter-spacing:-.02em;color:var(--accent)}
.hero .sub{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--muted);display:block;font-size:13px}
.stat b{font-size:18px}
.good{color:var(--good)}.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .t{font-weight:600}
.card .s{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:14px;color:var(--muted)}
.meta b{color:var(--text);font-weight:600}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
h3{margin:18px 0 8px;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;padding:8px 2px;border-radius:10px}
nav button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--bg);border:0;border-radius:99px;padding:13px 20px;font:inherit;font-weight:700;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 8px;font-size:19px}
label{display:block;margin:10px 0 0;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text);font:inherit;font-size:16px}
.row{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;margin-top:6px}
.row input{margin:0}
.row button{background:none;border:1px solid var(--line);border-radius:10px;color:var(--muted);font:inherit}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;margin-top:10px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.d{color:var(--bad)}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.chk{display:flex;align-items:center;gap:10px;color:var(--text);font-size:15px;margin-top:14px}
.chk input{width:22px;height:22px;margin:0}
.tools{display:flex;gap:8px}
.tools .btn{margin-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}a.btn{text-align:center;text-decoration:none}
.pri{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.pri summary{padding:12px 14px;font-weight:600;cursor:pointer}.pri .tbl{border:0;margin:0;border-radius:0}.sum .pri{border:0;margin:0;background:none}.sum .pri summary{padding:4px 0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;background:none;border:0;border-radius:9px;padding:9px 4px;font:inherit;font-size:14px;color:var(--muted)}.seg button.on{background:var(--accentbg);color:var(--accent);font-weight:700}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;font-size:14px}.tbl td{padding:9px 12px;border-bottom:1px solid var(--line)}.tbl tr:last-child td{border-bottom:0}.tbl td:not(:first-child){text-align:right}.tbl td:last-child{font-weight:600}
:root{--bg:#f4f4f4;--card:#fff;--text:#000;--muted:#6a6a6a;--line:#d9d9d9;--accent:#000;--accentbg:#ececec;--good:#000;--bad:#c62828;--input:transparent;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0b0b0b;--text:#fff;--muted:#8a8a8a;--line:#232323;--accent:#fff;--accentbg:#151515;--good:#fff;--bad:#ff6b5e;--input:transparent;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#0b0b0b;--text:#fff;--muted:#8a8a8a;--line:#232323;--accent:#fff;--accentbg:#151515;--good:#fff;--bad:#ff6b5e;--input:transparent;color-scheme:dark}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,a.btn,summary{touch-action:manipulation}
header{padding:26px 16px 10px}
header h1{font-family:"Space Grotesk",Inter,system-ui,sans-serif;font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
header h1 span{color:transparent;-webkit-text-stroke:1px var(--text)}
header p{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--muted)}
h2,h3,.hero b,.stat b,.card .t,.card b{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:600}
label{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.chk{text-transform:none;letter-spacing:0}
.hero{background:var(--text);border:0;border-radius:2px;padding:22px 20px}
.hero small{color:var(--bg);opacity:.6;text-transform:uppercase;letter-spacing:.16em;font-size:11px}
.hero b{color:var(--bg);font-size:40px;font-weight:700;letter-spacing:-.03em}
.hero .sub{color:var(--bg);opacity:.7}
.stat,.card,.sum,.tbl,.pri,.seg{border-radius:2px}
.stat small{text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.stat b{font-size:19px}
.card{padding:16px}
@media (hover:hover){.card:hover{border-color:var(--text)}}
.chip{border-radius:2px;text-transform:uppercase;letter-spacing:.1em;font-size:10px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
input:not([type=checkbox]),select{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;background:transparent}
textarea{border-radius:2px;background:transparent;padding:10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--text)}

<body>
<header><h1>EC <span>Cine</span></h1><p id="sub">Cinematic premium camera and marketing works. Video agency, 2020. Project and finance tracker.</p></header>
<main id="main"></main>
<button class="fab" id="fab" onclick="add()">+ New</button>
<nav>
<button data-t="home" onclick="go('home')">Overview</button>
<button data-t="work" onclick="go('work')">Work</button>
<button data-t="free" onclick="go('free')">Freelance</button>
<button data-t="pend" onclick="go('pend')">Pending Dates</button>
<button data-t="give" onclick="go('give')">Giving</button>
</nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<script>
var armed='',W='proj',M='',SORT='new',KEY='ecc_books_v1',S={projects:[],expenses:[]},tab='home',D=null,isNew=false,kind='';
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function mig(){S.tomb=S.tomb||{};S.projects.forEach(function(p){if(p.status==='Availed')p.status='Booked';if(p.status==='Completed')p.status='Complete';fixSt(p)})}
mig();
function hash(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)}
function stamp(list){(list||[]).forEach(function(r){var c={};Object.keys(r).forEach(function(k){if(k!=='_u'&&k!=='_hash')c[k]=r[k]});var h=hash(JSON.stringify(c));if(r._hash!==h){r._hash=h;r._u=Date.now()}})}
function save(){S.tomb=S.tomb||{};stamp(S.projects);stamp(S.expenses);var ch=JSON.stringify(S.cfg||{});if(S._cfgh!==ch){S._cfgh=ch;S.cfgU=Date.now()}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}schedSync()}
function $(s){return document.querySelector(s)}
function uid(){return Math.random().toString(36).slice(2,9)}
function inM(d){return !M||(d||'').slice(0,M.length)===M}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fmt(n){return new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(n||0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}
function itemsCost(p){return sum(p.items,function(i){return i.cost})}
function linked(p){return sum(S.expenses.filter(function(e){return e.pid===p.id}),function(e){return e.amt})}
function cost(p){return itemsCost(p)+linked(p)}
function availed(p){return ['Booked','Confirmed','Shoot Complete','Complete'].indexOf(p.status)>=0}
function tithe(p){return availed(p)?(+p.quote||0)*0.1:0}

function totals(){
 var av=S.projects.filter(function(p){return availed(p)&&!p.f&&share(p)>0});
 var rev=sum(av,sq);
 var rec=sum(av,sr);
 var costs=sum(av,function(p){return itemsCost(p)*share(p)})+sum(S.expenses.filter(function(e){var q=S.projects.filter(function(x){return x.id===e.pid})[0];return inM(e.date)&&!(q&&q.f)&&(!q||availed(q))}),function(e){return e.amt});
 var tt=rev*0.1, given=sum(av.filter(function(p){return p.tithe}),function(p){return tithe(p)*share(p)});
 var off=rev*0.1, offGiven=sum(av.filter(function(p){return p.offering}),function(p){return tithe(p)*share(p)});
 var pool=rev*0.4;
 return{rev:rev,rec:rec,out:rev-rec,costs:costs,tt:tt,given:given,left:tt-given,off:off,offGiven:offGiven,extra:rev*0.1,pay:rev*0.3,pool:pool,capital:pool-costs,n:av.length,sp:split(pool,costs,rev*0.1,rev*0.3)}
}

function go(t){tab=t;render()}
function render(){
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
 var bn=attn().filter(function(x){return (x.k==='q'&&x.due)||x.k==='r'||new Date().getHours()>=21}).length;
 document.querySelector('nav button[data-t="work"]').textContent=bn?'Work ('+bn+')':'Work';
 var pc=S.projects.filter(isPd).length;
 document.querySelector('nav button[data-t="pend"]').textContent=pc?'Pending Dates ('+pc+')':'Pending Dates';
 $('#fab').style.display=(tab==='home'||tab==='give'||tab==='pend'||(tab==='work'&&W==='tasks'))?'none':'block';
 $('#fab').textContent=(tab==='work'&&W==='proj')?'+ New project':tab==='free'?'+ New freelance':'+ New expense';
 $('#main').innerHTML=tab==='home'?home():tab==='give'?giveTab():tab==='pend'?pendTab():tab==='free'?frSum()+projList(true):workTab();
}
function home(){
 var t=totals();
 var h=ctrl()+'<div class="hero"><small>Total booked, '+plabel()+' ('+t.n+')</small><b class="num">'+fmt(t.rev*0.8)+'</b><div class="sub"><span>Received '+fmt(t.rec*0.8)+'</span><span>To collect '+fmt((t.rev-t.rec)*0.8)+'</span></div></div>'+yearBox()+bookedBox()+alloc(t);
 h+='<div class="grid">'+
 st('Tithe given',fmt(t.given)+' of '+fmt(t.tt))+
 st('Offering given',fmt(t.offGiven)+' of '+fmt(t.off))+
 st('Expenses (from capital)',fmt(t.costs))+
 st('Capital left after costs',fmt(t.sp.capL),t.sp.over>0?'bad':'good')+'</div>';
 h+=freeHome();
 h+=catHome()+listHome();
 h+=syncBox();
 h+='<h3>Backup</h3><p class="s" style="color:var(--muted);font-size:14px;margin:0 0 8px">Data is saved on this device only. Export a copy now and then.</p><div class="tools"><button class="btn" onclick="exp()">Export</button><button class="btn" onclick="imp()">Import</button></div>';
 return h;
}
function mlabel(m){var a=m.split('-');return new Date(+a[0],+a[1]-1,1).toLocaleString('en-PH',{month:'long',year:'numeric'})}
function ctrl(){return ctrl2();
 var ms={};S.projects.forEach(function(p){if(p.date&&availed(p))ms[p.date.slice(0,7)]=1});S.expenses.forEach(function(e){if(e.date&&ec(e))ms[e.date.slice(0,7)]=1});
 var list=Object.keys(ms).sort().reverse();
 if(M&&!ms[M])list.unshift(M);
 return '<label>Period<select onchange="M=this.value;render()"><option value="">All time</option>'+list.map(function(m){return '<option value="'+m+'"'+(M===m?' selected':'')+'>'+mlabel(m)+'</option>'}).join('')+'</select></label><div style="height:12px"></div>';
}
function sorter(){return function(a,b){
 if(SORT==='old')return (a.date||'').localeCompare(b.date||'');
 if(SORT==='high')return (+b.quote||0)-(+a.quote||0);
 if(SORT==='low')return (+a.quote||0)-(+b.quote||0);
 if(SORT==='az')return (a.client||'').localeCompare(b.client||'');
 return (b.date||'').localeCompare(a.date||'')}}
function sortCtl(){
 var o=[['new','Newest first'],['old','Oldest first'],['high','Highest quote'],['low','Lowest quote'],['az','Client A to Z']];
 return '<label>Sort by<select onchange="SORT=this.value;render()">'+o.map(function(x){return '<option value="'+x[0]+'"'+(SORT===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label><div style="height:10px"></div>';
}
function catHome(){
 var cats={},h='<h3>Expenses by category</h3>';
 S.expenses.forEach(function(e){if(inM(e.date)&&ec(e))cats[e.cat]=(cats[e.cat]||0)+(+e.amt||0)});
 var ks=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
 h+=ks.length?'<table class="tbl num">'+ks.map(function(k){return '<tr><td>'+esc(k)+'</td><td>'+fmt(cats[k])+'</td></tr>'}).join('')+'</table>':'<p style="color:var(--muted);font-size:14px">No expenses in this period.</p>';
 if(!M){
  var ms={};
  S.projects.forEach(function(p){var k=(p.date||'').slice(0,7);if(k&&availed(p)){ms[k]=ms[k]||{q:0,e:0};ms[k].q+=+p.quote||0}});
  S.expenses.forEach(function(e){var k=(e.date||'').slice(0,7);if(k&&ec(e)){ms[k]=ms[k]||{q:0,e:0};ms[k].e+=+e.amt||0}});
  var mk=Object.keys(ms).sort().reverse();
  if(mk.length)h+='<h3>By month</h3><table class="tbl num"><tr style="color:var(--muted)"><td>Month</td><td>Quotes</td><td>Expenses</td></tr>'+mk.map(function(k){return '<tr><td>'+mlabel(k)+'</td><td>'+fmt(ms[k].q)+'</td><td>'+fmt(ms[k].e)+'</td></tr>'}).join('')+'</table>';
 }
 return h;
}
var OV='proj';
function listHome(){
 var f=OV==='free';
 var L=S.projects.filter(function(p){return availed(p)&&!!p.f===f&&share(p)>0});
 var tot=sum(L,sq);
 var seg='<div class="seg">'+[['proj','Projects'],['free','Freelance']].map(function(x){return '<button class="'+(OV===x[0]?'on':'')+'" onclick="OV=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('')+'</div>';
 return '<h3>Booked projects</h3>'+seg+'<div class="stat" style="margin-bottom:12px"><small>Total quoted rate ('+L.length+' booked)</small><b class="num">'+fmt(tot)+'</b></div>'+projList(f?'ov1':'ov0');
}
function days(a){var d=new Date(a+'T00:00:00'),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.floor((t-d)/864e5)}
function fd(){return (S.cfg&&+S.cfg.fd)||3}
function attn(){
 var out=[];
 S.projects.forEach(function(p){
  if(p.status==='Quoted'){var dd=0;var base=(p.fu&&p.fu>(p.date||''))?p.fu:p.date;if(base)dd=days(base);out.push({p:p,k:'q',d:dd,due:dd>=fd()})}
  else if(p.status==='Retainer Fee Pending')out.push({p:p,k:'r',d:0});else if(p.status==='Booked'||p.status==='Confirmed')out.push({p:p,k:'a',d:0});else if(p.status==='Shoot Complete')out.push({p:p,k:'s',d:0});
 });
 out.sort(function(a,b){return (b.due?1:0)-(a.due?1:0)});
 return out;
}
function setS(id,s){S.projects.forEach(function(p){if(p.id===id){p.status=s;fixSt(p)}});save();render()}
function depRcv(id){S.projects.forEach(function(p){if(p.id===id){p.depst='Received';if(!p.depdate)p.depdate=today();fixSt(p)}});save();render()}
function fup(id){S.projects.forEach(function(p){if(p.id===id)p.fu=today()});save();render()}
function attnHome(){
 var L=attn();if(!L.length)return '';
 var eve=new Date().getHours()>=21,hasA=L.some(function(x){return x.k==='a'||x.k==='s'});
 return '<h3>'+(eve&&hasA?'Evening check: any finished projects?':'Needs attention')+'</h3>'+L.map(function(x){
  var p=x.p;
  return '<div class="card" style="cursor:default'+((x.k==='a'||x.k==='s')&&eve?';border-color:var(--accent)':'')+'"><div class="top"><div><div class="t">'+cn(p)+'</div><div class="s">'+esc(p.title)+(p.f?' (freelance)':'')+'</div></div><b class="num">'+fmt(p.quote)+'</b></div>'+dsc(p)+shootLines(p,x.k)+'<div class="meta"><span>'+(x.k==='q'?(x.due?'Quoted '+days(x.p.date)+' days ago. Time to follow up?':'Quoted '+days(x.p.date)+' days ago. Follow up in '+(fd()-x.d)+' day'+(fd()-x.d===1?'':'s')+'.'):x.k==='r'?'Retainer fee pending. Has the deposit come in?':x.k==='a'?'Booked. Shoot done yet?':'Shoot complete. Ready to mark complete?')+'</span></div>'+
  (x.k==='r'?'<div class="tools" style="margin-top:8px;flex-wrap:wrap"><button class="btn p" style="flex:1 1 45%" onclick="depRcv(\''+p.id+'\')">Deposit received</button><button class="btn" style="flex:1 1 45%" onclick="setS(\''+p.id+'\',\'No Response\')">No response</button><button class="btn" style="flex:1 1 45%" onclick="setS(\''+p.id+'\',\'Rejected\')">Rejected</button></div>':x.k==='q'?'<div class="tools" style="margin-top:8px;flex-wrap:wrap"><button class="btn p" style="flex:1 1 45%" onclick="setS(\''+p.id+'\',\'Booked\')">Booked</button><button class="btn" style="flex:1 1 45%" onclick="fup(\''+p.id+'\')">Followed up</button><button class="btn" style="flex:1 1 45%" onclick="setS(\''+p.id+'\',\'No Response\')">No response</button><button class="btn" style="flex:1 1 45%" onclick="setS(\''+p.id+'\',\'Rejected\')">Rejected</button></div>':(x.k==='a'&&shootN(p)?'<div class="s" style="margin-top:8px">Mark each shoot day complete above. The project updates when all of them are done.</div>':'<div class="tools" style="margin-top:8px"><button class="btn p" onclick="setS(\''+p.id+'\',\''+(x.k==='a'?'Shoot Complete':'Complete')+'\')">'+(x.k==='a'?'Shoot complete':'Mark complete')+'</button></div>'))+'</div>';
 }).join('');
}
function fuCtl(){
 var o=[2,3,5,7,14];
 return '<h3>Reminders</h3><label>Follow up on quotes after<select onchange="S.cfg=S.cfg||{};S.cfg.fd=+this.value;save();render()">'+o.map(function(n){return '<option value="'+n+'"'+(fd()===n?' selected':'')+'>'+n+' days</option>'}).join('')+'</select></label><p style="color:var(--muted);font-size:14px">Booked and shoot-complete projects are listed above, and highlighted after 9 PM. This app can’t ring your phone while it is closed, so pair it with a phone alarm.</p>';
}
function tasksTab(){
 return (attnHome()||'<div class="empty">Nothing to follow up or complete right now.</div>')+fuCtl();
}
function tick(id,k,v){S.projects.forEach(function(p){if(p.id===id)p[k]=v});save();render()}
function giveTab(){
 var av=S.projects.filter(function(p){return availed(p)&&share(p)>0}).sort(function(a,b){var x=(a.tithe?1:0)+(a.offering?1:0),y=(b.tithe?1:0)+(b.offering?1:0);return x-y||(b.date||'').localeCompare(a.date||'')});
 var due=sum(av,tithe),tg=sum(av.filter(function(p){return p.tithe}),tithe),og=sum(av.filter(function(p){return p.offering}),tithe);
 var h=ctrl()+'<div class="grid">'+st('Tithe given',fmt(tg)+' of '+fmt(due))+st('Offering given',fmt(og)+' of '+fmt(due))+'</div>';
 if(!av.length)return h+'<div class="empty">No booked projects in this period.<br>Tithe and offering show up here once a quote is booked.</div>';
 return h+av.map(function(p){
  return '<div class="card" style="cursor:default"><div class="top"><div><div class="t">'+cn(p)+'</div><div class="s">'+esc(p.title)+(p.f?' (freelance)':'')+'</div><div class="s">'+esc(p.date)+'</div></div><b class="num">'+fmt(p.quote)+'</b></div>'+
  '<label class="chk"><input type="checkbox"'+(p.tithe?' checked':'')+' onchange="tick(\''+p.id+'\',\'tithe\',this.checked)"> Tithe '+fmt(tithe(p))+'</label>'+
  '<label class="chk"><input type="checkbox"'+(p.offering?' checked':'')+' onchange="tick(\''+p.id+'\',\'offering\',this.checked)"> Offering '+fmt(tithe(p))+'</label></div>';
 }).join('');
}

function upd(){
 if(kind!=='p'||!D)return;
 var cl=$('#cal');if(cl)cl.innerHTML=calHtml(D);
 var cm=$('#calm');if(cm)cm.innerHTML=calLinks(D,{date:D.edate,etime:D.etime,etime2:D.etime2,loc:D.eloc,desc:''});
 (D.days||[]).forEach(function(d,i){var e=$('#cald'+i);if(e)e.innerHTML=calLinks(D,d)});
 var dp=$('#dep');if(dp)dp.innerHTML=depHtml(D);
 var ds=$('#dsum');if(ds)ds.innerHTML=daysSumHtml(D);
 var c=itemsCost(D)+linked(D),q=+D.quote||0,a=q,t=a*0.1,m=q-c,pay=D.f?0.6:0.3,cap=D.f?0.1:0.4;
 $('#sum').innerHTML=sumHtml(a,c,q,m,pay,cap);return;
 $('#sum').innerHTML='<div><span>Expenses (paid from business capital)</span><b class="num">'+fmt(c)+'</b></div><div><span>Margin (quote minus costs, this project only)</span><b class="num '+(m<0?'bad':'good')+'">'+fmt(m)+(q?' ('+Math.round(m/q*100)+'%)':'')+'</b></div><div><span>Tithe (10%)</span><b class="num">'+fmt(t)+'</b></div><div><span>Offering (10%)</span><b class="num">'+fmt(t)+'</b></div><div><span>Owner’s extra profit (10%)</span><b class="num">'+fmt(t)+'</b></div><div><span>Owner’s personal pay ('+Math.round(pay*100)+'%)</span><b class="num">'+fmt(a*pay)+'</b></div><div><span>'+(D.f?'Funds to business capital':'Business and capital')+' ('+Math.round(cap*100)+'%)</span><b class="num">'+fmt(a*cap)+'</b></div>'+('<div><span>Capital left after this project’s costs</span><b class="num '+(a*cap-c<0?'bad':'good')+'">'+fmt(a*cap-c)+'</b></div>')+'<div><span>Balance still to collect</span><b class="num">'+fmt(q-(+D.received||0))+'</b></div>';
}
function addItem(){D.items.push({name:'',cost:0});projSheet()}
function delItem(i){D.items.splice(i,1);projSheet()}
function saveProj(){
 D.items=D.items.filter(function(i){return i.name||i.cost});
 D.days=(D.days||[]).filter(function(d){return d.date||d.budget||d.loc||d.desc});
 D.other=(D.other||[]).filter(function(o){return o.name||o.amt});
 fixSt(D);
 var i=S.projects.findIndex(function(p){return p.id===D.id});
 if(i<0)S.projects.push(D);else S.projects[i]=D;
 save();closeSheet();render();
}
function delProj(){
 if(armed!=='p'){armed='p';$('#dp').textContent='Tap again to delete this project';return}
 armed='';
 S.tomb=S.tomb||{};S.tomb[D.id]=Date.now();
 S.projects=S.projects.filter(function(p){return p.id!==D.id});
 S.expenses.forEach(function(e){if(e.pid===D.id)e.pid=''});
 save();closeSheet();render();
}
